packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@expo/metro-runtime": 57.0.11
  expo-constants: 57.0.12
  expo-file-system: 57.0.1
  react-native: 0.86.2
patchedDependencies:
  expo-modules-jsi@57.0.4: patches/expo-modules-jsi@57.0.4.patch
onlyBuiltDependencies:
  - msgpackr-extract
  - sharp
  - unrs-resolver
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - expo-modules-autolinking@57.0.4
  - expo@57.0.2
